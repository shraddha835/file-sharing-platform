spring:
  application:
    name: file-sharing-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/filesharingdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
    expiration-ms: ${JWT_EXPIRATION:86400000}   # 24 hours

  storage:
    location: ${STORAGE_PATH:./uploads}

  base-url: ${BASE_URL:http://localhost:8080}

  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.filesharing: DEBUG
    org.springframework.security: INFO
